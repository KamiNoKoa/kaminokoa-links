<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kaminokoa | Links</title>
  <style>
    :root {
      --card-bg: rgba(30, 30, 30, 0.75);
      --card-hover: rgba(45, 45, 45, 0.9);
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fixed full-screen video background */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .profile-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .video-container {
      width: 100%;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: var(--card-bg);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-btn {
      display: block;
      width: 100%;
      padding: 1rem 1.25rem;
      background-color: var(--card-bg);
      color: var(--text);
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .link-btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <!-- Fullscreen MP4 Background -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="Background.mp4" type="video/mp4">
  </video>

  <div class="container">
    <h1 class="profile-title">kaminokoa</h1>

    <!-- Embedded YouTube Video Player -->
    <div class="video-container">
      <iframe 
        src="https://m.youtube.com/watch?v=48bNay9JZBY&pp=ygULS2FtaW5va29hdHY%3D" 
        title="kaminokoaTV Latest Video" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="links">
      <a href="https://www.tiktok.com/@kaminokoa" target="_blank" rel="noopener noreferrer" class="link-btn">
        TikTok
      </a>

      <a href="https://www.instagram.com/kaminokoa" target="_blank" rel="noopener noreferrer" class="link-btn">
        Instagram
      </a>

      <a href="mailto:kaminokoa.mgmt@gmail.com" class="link-btn">
        Management / Contact
      </a>
    </div>
  </div>
</body>
</html>
